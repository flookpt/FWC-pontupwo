<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <titl>ex02</titl>
</head>
<body>

  <form id="calc-form" class="calculator">
    <input type="text" id="left">

    <select id="operator">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
      <option value="%">%</option>
    </select>

    <input type="text" id="right">

    <input type="submit" value="Try me!">
  </form>

  <script src="calc.js"></script>
</body>
</html>
