<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      height: 50%;
      margin: 0;
    }
    table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
    }
    td {
      width: 50%;
      border: 1px solid #666;
      text-align: left;
      vertical-align: middle;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td style="background:goldenrod;">echo</td>
      <td style="background:#80ccfb;">hello world</td>
    </tr>
  </table>
</body>
</html>
